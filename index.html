<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Auth Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex justify-center items-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto text-xl font-bold shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-helmet-safety"></i>
                </div>
                <h1 class="text-xl font-bold text-white">Apex Project Controls</h1>
                <p class="text-xs text-slate-400">Secure Sign-In Gateway</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                </div>
                <div id="login-error" class="text-red-400 text-xs text-center hidden"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg shadow-blue-600/25">
                    Sign In to Portal
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== AUTHENTICATED WORKSPACE ==================== -->
    <div id="workspace" class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-8 space-y-6 shadow-2xl hidden text-center">
        <div class="bg-green-500/10 text-green-400 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl border border-green-500/20">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-white">Successfully Logged In!</h2>
            <p id="user-email-display" class="text-sm text-slate-300"></p>
            <div id="user-role-display" class="inline-block px-3 py-1 bg-blue-500/10 text-blue-400 rounded-full text-xs font-semibold border border-blue-500/20"></div>
        </div>
        <div class="pt-4 border-t border-slate-700">
            <button onclick="handleLogout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white font-medium px-6 py-2.5 rounded-lg text-xs transition border border-red-500/30">
                <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Sign Out
            </button>
        </div>
    </div>

    <!-- ==================== SCRIPT ENGINE ==================== -->
    <script>
        // Use "=" not ":" when filling these in:
        const SUPABASE_URL = https://flytseyobsxtuvcsvwoe.supabase.co/rest/v1/;
        const SUPABASE_ANON_KEY = sb_publishable_Dpc23_2yhh2trJLukXl-pg_SY7q5FA8;
        
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_URL.includes("http") && !SUPABASE_URL.includes("YOUR_SUPABASE")) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        async function initAuth() {
            if (!supabaseClient) {
                console.warn("Supabase credentials not set yet.");
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (data && data.session) {
                    showWorkspace(data.session.user);
                }
            } catch (err) {
                console.error("Session check failed:", err);
            }
        }

        async function handleLogin(e) {
            if (e) e.preventDefault();
            
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const errorEl = document.getElementById('login-error');
            
            errorEl.classList.add('hidden');
            errorEl.innerText = '';

            if (!supabaseClient) {
                errorEl.innerText = "Supabase client is not configured. Check your code keys.";
                errorEl.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: emailInput.value.trim(), 
                password: passwordInput.value 
            });

            if (error) {
                errorEl.innerText = error.message;
                errorEl.classList.remove('hidden');
                return;
            }

            if (data && data.user) {
                emailInput.value = '';
                passwordInput.value = '';
                showWorkspace(data.user);
            }
        }

        async function handleLogout() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            window.location.reload();
        }

        async function showWorkspace(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('workspace').classList.remove('hidden');
            
            document.getElementById('user-email-display').innerText = 'Logged in as: ' + user.email;

            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                const roleText = profile ? 'Role: ' + profile.role.toUpperCase() : 'Role: Unassigned';
                document.getElementById('user-role-display').innerText = roleText;
            } catch (err) {
                document.getElementById('user-role-display').innerText = 'Role: Unassigned / Error';
            }
        }

        // Run on load
        initAuth();
    </script>
</body>
</html>
